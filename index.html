<style>
:root{--accent:#00e5ff;--accent2:#00a8bf;--warm:#ff6b35;--love:#ff2d55;--glass:rgba(255,255,255,0.07);--glassh:rgba(255,255,255,0.13);--border:rgba(255,255,255,0.10);--bg:#060608;--surface:#0d0d12;--text:#e8e8f0;--muted:#6a6a80;--ff-head:'Rajdhani',sans-serif;--ff-body:'Nunito',sans-serif;--blur:blur(22px);--r:18px;--trans:all 0.35s cubic-bezier(0.4,0,0.2,1)}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;overflow:hidden;position:fixed;background:var(--bg);color:var(--text);font-family:var(--ff-body)}
#bg-canvas{position:fixed;inset:0;z-index:0;opacity:0.18;pointer-events:none}
#topo{position:fixed;top:0;left:0;right:0;height:64px;background:rgba(6,6,8,0.82);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 18px;z-index:900}
.logo{font-family:var(--ff-head);font-size:1.4rem;font-weight:700;letter-spacing:3px;text-transform:uppercase;background:linear-gradient(90deg,#fff 20%,var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.logo-tag{font-size:.55rem;letter-spacing:2px;color:var(--accent);background:rgba(0,229,255,.12);border:1px solid rgba(0,229,255,.3);padding:2px 6px;border-radius:6px;-webkit-text-fill-color:var(--accent);margin-left:8px;vertical-align:middle}
.topo-actions{display:flex;gap:16px;align-items:center}
.topo-btn{font-size:1.2rem;color:var(--muted);cursor:pointer;transition:var(--trans)}
.topo-btn:active,.topo-btn:hover{color:var(--accent)}
#familia-bar{position:fixed;top:64px;left:0;right:0;height:88px;background:rgba(6,6,8,0.75);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;padding:0 18px;overflow-x:auto;scrollbar-width:none;z-index:850}
#familia-bar::-webkit-scrollbar{display:none}
.membro{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;transition:var(--trans)}
.membro-ring{width:52px;height:52px;border-radius:50%;padding:2.5px;background:var(--border);transition:var(--trans)}
.membro.ativo.membro-ring{background:linear-gradient(135deg,var(--accent),var(--warm));box-shadow:0 0 18px rgba(0,229,255,.35)}
.membro.story.membro-ring{background:linear-gradient(135deg,var(--warm),var(--love));box-shadow:0 0 18px rgba(255,107,53,.35)}
.membro-foto{width:100%;height:100%;border-radius:50%;background-size:cover;background-position:center;background-color:#1a1a22;display:flex;align-items:center;justify-content:center;font-size:1.3rem;border:2px solid var(--bg);overflow:hidden}
.membro-foto img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.membro-nome{font-size:.65rem;color:var(--muted);font-family:var(--ff-head);letter-spacing:1px;transition:var(--trans)}
.membro.ativo.membro-nome{color:var(--accent)}
.membro-add.membro-ring{background:var(--glass);border:1.5px dashed var(--border)}
.membro-add.membro-foto{background:transparent;font-size:.9rem;color:var(--accent)}
.tela{position:fixed;inset:0;padding-top:152px;padding-bottom:72px;display:none;flex-direction:column;z-index:100;transition:opacity.3s ease}
.tela.ativa{display:flex}
#tela-chat{background:transparent}
#mensagens{flex:1;overflow-y:auto;padding:16px 14px 8px;display:flex;flex-direction:column;gap:10px;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
#mensagens::-webkit-scrollbar{width:3px}
#mensagens::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.balao-wrap{display:flex;flex-direction:column;gap:3px}
.balao-wrap.minha{align-items:flex-end}
.balao-wrap.deles{align-items:flex-start}
.balao-autor{font-size:.65rem;font-family:var(--ff-head);letter-spacing:1.5px;text-transform:uppercase;color:var(--accent);opacity:.8;padding:0 6px}
.balao{max-width:78%;padding:12px 16px;border-radius:20px;font-size:.9rem;line-height:1.55;position:relative;word-break:break-word;animation:msgIn.28s cubic-bezier(0.34,1.56,0.64,1) both}
@keyframes msgIn{from{opacity:0;transform:translateY(14px) scale(.93)}to{opacity:1;transform:translateY(0) scale(1)}}
.balao.deles{background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--border);border-bottom-left-radius:5px}
.balao.minha{background:linear-gradient(135deg,var(--accent2),var(--accent));color:#000;font-weight:600;border-bottom-right-radius:5px}
.balao img,.balao video{max-width:200px;width:100%;border-radius:12px;display:block;margin-top:8px}
.balao audio{width:100%;margin-top:8px;height:40px}
.balao-time{font-size:.6rem;margin-top:6px;display:block;opacity:.55;font-family:var(--ff-head)}
.balao.minha.balao-time{text-align:right;color:rgba(0,0,0,.5)}
#controles{position:fixed;bottom:0;left:0;right:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:rgba(6,6,8,.92);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border-top:1px solid var(--border);display:flex;align-items:center;gap:10px;z-index:900}
.ctrl-btn{width:42px;height:42px;border-radius:50%;background:var(--glass);border:1px solid var(--border);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:1rem;cursor:pointer;flex-shrink:0;transition:var(--trans)}
.ctrl-btn:active{transform:scale(.88);background:var(--glassh)}
.ctrl-btn.gravando{background:rgba(255,45,85,.15);border-color:var(--love);color:var(--love);animation:pulseMic 1s infinite}
@keyframes pulseMic{0%,100%{box-shadow:0 0 0 0 rgba(255,45,85,.5)}50%{box-shadow:0 0 0 8px rgba(255,45,85,0)}}
#msgInput{flex:1;background:#13131a;border:1px solid var(--border);color:var(--text);padding:12px 18px;border-radius:28px;font-size:.9rem;font-family:var(--ff-body);outline:none;transition:var(--trans)}
#msgInput:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,229,255,.08)}
#msgInput::placeholder{color:var(--muted)}
.ctrl-send{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--accent2),var(--accent));border:none;color:#000;font-size:1rem;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;box-shadow:0 4px 16px rgba(0,229,255,.35);transition:var(--trans)}
.ctrl-send:active{transform:scale(.88)}
#tela-galeria{background:rgba(6,6,8,.95)}
.galeria-header{padding:0 18px 14px;display:flex;align-items:center;justify-content:space-between}
.galeria-title{font-family:var(--ff-head);font-size:1.25rem;font-weight:700;letter-spacing:2px}
.btn-postar{background:linear-gradient(135deg,var(--accent2),var(--accent));color:#000;border:none;padding:10px 20px;border-radius:20px;font-family:var(--ff-head);font-size:.85rem;font-weight:700;letter-spacing:1px;cursor:pointer;transition:var(--trans);display:flex;align-items:center;gap:8px}
.btn-postar:active{transform:scale(.95)}
#grid-videos{flex:1;overflow-y:auto;padding:0 14px 14px;display:grid;grid-template-columns:1fr 1fr;gap:12px;align-content:start}
.video-card{aspect-ratio:9/16;border-radius:var(--r);overflow:hidden;background:#0d0d14;border:1px solid var(--border);position:relative}
.video-card video{width:100%;height:100%;object-fit:cover;display:block}
.video-card-footer{position:absolute;bottom:0;left:0;right:0;padding:8px 10px;background:linear-gradient(to top,rgba(0,0,0,.8),transparent);display:flex;justify-content:space-between;align-items:center}
.video-autor{font-size:.65rem;color:#fff;font-family:var(--ff-head);letter-spacing:1px}
.btn-like{display:flex;align-items:center;gap:5px;background:rgba(0,0,0,.4);padding:5px 10px;border-radius:20px;cursor:pointer;font-size:.75rem;color:#fff;border:1px solid rgba(255,255,255,.15);transition:var(--trans)}
.btn-like.curtido{color:var(--love);border-color:var(--love)}
.btn-like:active{transform:scale(.88)}
#progresso{position:fixed;top:0;left:0;height:3px;width:0%;background:linear-gradient(90deg,var(--accent2),var(--accent));z-index:9999;box-shadow:0 0 10px var(--accent);transition:width.3s linear}
#toasts{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);z-index:9998;display:flex;flex-direction:column-reverse;gap:8px;pointer-events:none;width:88%}
.toast{background:rgba(0,229,255,.12);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(0,229,255,.3);padding:12px 18px;border-radius:14px;font-size:.82rem;text-align:center;animation:toastIn.3s ease-out}
@keyframes toastIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);z-index:1100;display:none;align-items:flex-end}
.modal-bg.aberto{display:flex}
.modal-sheet{width:100%;background:#0d0d14;border:1px solid var(--border);border-radius:24px 24px 0 0;padding:20px 22px calc(24px + env(safe-area-inset-bottom,0px));animation:sheetUp.35s cubic-bezier(0.34,1.56,0.64,1)}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-handle{width:38px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 20px}
.modal-title{font-family:var(--ff-head);font-size:1.1rem;font-weight:700;letter-spacing:2px;margin-bottom:18px}
.modal-input{width:100%;background:#13131a;border:1px solid var(--border);color:var(--text);padding:14px 18px;border-radius:14px;font-size:.9rem;font-family:var(--ff-body);outline:none;margin-bottom:14px;transition:var(--trans)}
.modal-input:focus{border-color:var(--accent)}
.modal-ok{width:100%;padding:15px;background:linear-gradient(135deg,var(--accent2),var(--accent));color:#000;border:none;border-radius:14px;font-family:var(--ff-head);font-size:.95rem;font-weight:700;letter-spacing:1px;cursor:pointer}
</style>

  </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAWL1XRR8JK-J5Qk5DSIKmBl4ZYMZw1R4I",
  databaseURL: "https://vibe-app-bbba2-default-rtdb.firebaseio.com/",
  projectId: "vibe-app-bbba2",
  storageBucket: "vibe-app-bbba2.appspot.com"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();
const storage = firebase.storage();

const dbMsg = db.ref("familia_mensagens");
const dbStatus = db.ref("familia_status");

let authReady = !!auth.currentUser;
auth.onAuthStateChanged(user => {
  authReady = !!user;
  atualizarEstadoLogin(user);

  const chat = document.getElementById("tela-chat");
  const controles = document.getElementById("controles");
  const login = document.getElementById("modalLogin");

  if (user) {
    chat.classList.add("ativa");
    controles.style.display = "flex";
    login.classList.remove("aberto", "login-inicial");

    if (!localStorage.getItem("oio_nome")) {
      const nomeConta = user.displayName || (user.email || "").split("@")[0] || "Visitante";
      localStorage.setItem("oio_nome", nomeConta);
      meuNome = nomeConta;
    }
    renderMembros();
    atualizarCabecalho();
  } else {
    chat.classList.remove("ativa");
    controles.style.display = "none";
    login.classList.add("aberto", "login-inicial");
    abrirLogin();
  }
});

let meuNome = localStorage.getItem("oio_nome") || "";
let minhaFoto = localStorage.getItem("oio_foto") || "";

const AC = window.AudioContext || window.webkitAudioContext;
let audioCtx;
function getAC() { if (!audioCtx) audioCtx = new AC(); return audioCtx; }
function beep(freq=880, dur=.08, type='sine', vol=.25) {
  try {
    const ctx = getAC();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value = freq; o.type = type;
    g.gain.setValueAtTime(vol, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + dur);
    o.start(); o.stop(ctx.currentTime + dur);
  } catch(e){}
}
function somEnviar() { beep(1200,.06,'sine',.2); setTimeout(()=>beep(1600,.06,'sine',.15),80); }
function somReceber() { beep(660,.1,'sine',.18); setTimeout(()=>beep(880,.08,'sine',.12),100); }
function somCurtir() { [440,550,660].forEach((f,i)=>setTimeout(()=>beep(f,.07,'sine',.2),i*60)); }
function vibrar(ms=40){ if(navigator.vibrate) navigator.vibrate(ms); }

function toast(msg) {
  const c = document.getElementById("toasts");
  const t = document.createElement("div");
  t.className = "toast"; t.textContent = msg;
  c.appendChild(t);
  setTimeout(() => { t.style.opacity="0"; t.style.transition="opacity.3s"; setTimeout(()=>t.remove(),300); }, 2800);
}

const membrosDefault = [
  { nome:"Michel", foto:"https://github.com/MichelDetilli.png", emoji:"" },
  { nome:"Gabriela", foto:"", emoji:"👩" }
];
let membrosLista = JSON.parse(localStorage.getItem("oio_membros")) || membrosDefault;

function salvarMembros() { localStorage.setItem("oio_membros", JSON.stringify(membrosLista)); }

function renderMembros() {
  const bar = document.getElementById("familia-bar");
  bar.innerHTML = "";
  membrosLista.forEach(m => {
    const div = document.createElement("div");
    div.className = "membro" + (m.nome === meuNome ? " ativo" : "");
    div.onclick = () => trocarMembro(m.nome);
    const fotoConteudo = m.foto ? `<img src="${m.foto}" alt="${escapeHtml(m.nome)}">` : `<span>${m.emoji || escapeHtml(m.nome[0].toUpperCase())}</span>`;
    div.innerHTML = `<div class="membro-ring"><div class="membro-foto">${fotoConteudo}</div></div><span class="membro-nome">${escapeHtml(m.nome)}</span>`;
    bar.appendChild(div);
  });
  const add = document.createElement("div");
  add.className = "membro membro-add";
  add.onclick = () => document.getElementById("modalMembro").classList.add("aberto");
  add.innerHTML = `<div class="membro-ring"><div class="membro-foto"><i class="fa-solid fa-plus"></i></div></div><span class="membro-nome">ADD</span>`;
  bar.appendChild(add);
}

function trocarMembro(nome) {
  meuNome = nome; localStorage.setItem("oio_nome", nome);
  vibrar(30); renderMembros(); atualizarCabecalho(); toast(`Você é ${nome} agora`);
}
renderMembros();


function abrirLogin() {
  const primeiroAcesso = !auth.currentUser && !localStorage.getItem("manchet_conta_criada");
  if (primeiroAcesso) {
    abrirCadastro();
  } else {
    const btn = document.querySelector('#modalLogin button[onclick="criarConta"]');
    if (btn) {
      btn.textContent = "ENTRAR";
      btn.onclick = entrarConta;
    }
    const modalTitle = document.querySelector("#modalLogin .modal-title");
    if (modalTitle) modalTitle.textContent = "ENTRAR NA FAMÍLIA";
    document.getElementById("modalLogin").classList.add("aberto");
    setTimeout(() => document.getElementById("loginEmail")?.focus(), 100);
  }
}

function fecharLogin(e) {
  if (!e || e.target === document.getElementById("modalLogin"))
    document.getElementById("modalLogin").classList.remove("aberto");
}

function atualizarEstadoLogin(user) {
  const status = document.getElementById("loginStatus");
  const send = document.querySelector(".ctrl-send");
  if (user) {
    if (status) status.textContent = "Conectado: " + (user.email || "conta Firebase");
    if (send) send.title = "Enviar mensagem";
  } else {
    if (send) send.title = "Entrar para enviar";
  }
}


function abrirCadastro() {
  document.getElementById("loginEmail").value = "";
  document.getElementById("loginSenha").value = "";
  const status = document.getElementById("loginStatus");
  status.textContent = "Primeira vez? Crie sua conta com e-mail e senha.";
  const btn = document.querySelector('#modalLogin button[onclick="entrarConta()"]');
  if (btn) {
    btn.textContent = "CRIAR E ENTRAR";
    btn.onclick = criarConta;
  }
  const modalTitle = document.querySelector("#modalLogin .modal-title");
  if (modalTitle) modalTitle.textContent = "CRIAR CONTA · FAMÍLIA";
}

async function criarConta() {
  const email = document.getElementById("loginEmail").value.trim();
  const senha = document.getElementById("loginSenha").value;
  const status = document.getElementById("loginStatus");
  if (!email || !senha) {
    status.textContent = "Informe e-mail e senha.";
    return;
  }
  if (senha.length < 6) {
    status.textContent = "A senha precisa ter pelo menos 6 caracteres.";
    return;
  }
  status.textContent = "Criando sua conta...";
  try {
    const cred = await auth.createUserWithEmailAndPassword(email, senha);
    localStorage.setItem("manchet_conta_criada", "1");
    document.getElementById("modalLogin").classList.remove("aberto");
    toast("Conta criada! Você já está conectado.");
    atualizarEstadoLogin(cred.user);
    console.log("Conta Manchet criada:", cred.user.uid);
  } catch (err) {
    console.error("Cadastro Firebase:", err);
    if (err && err.code === "auth/email-already-in-use") {
      status.textContent = "Este e-mail já possui uma conta. Use ENTRAR.";
    } else if (err && err.code === "auth/weak-password") {
      status.textContent = "Escolha uma senha mais forte.";
    } else if (err && err.code === "auth/invalid-email") {
      status.textContent = "E-mail inválido.";
    } else {
      status.textContent = "Não foi possível criar a conta.";
    }
  }
}

async function entrarConta() {
  const email = document.getElementById("loginEmail").value.trim();
  const senha = document.getElementById("loginSenha").value;
  const status = document.getElementById("loginStatus");
  if (!email || !senha) {
    status.textContent = "Informe e-mail e senha.";
    return;
  }
  status.textContent = "Entrando...";
  try {
    const cred = await auth.signInWithEmailAndPassword(email, senha);
    localStorage.setItem("manchet_conta_criada", "1");
    status.textContent = "Conectado: " + (cred.user.email || email);
    document.getElementById("modalLogin").classList.remove("aberto");
    toast("Login realizado. Agora suas mensagens serão salvas.");
  } catch (err) {
    console.error("Login Firebase:", err);
    status.textContent = "E-mail ou senha inválidos.";
    toast("Não foi possível entrar.");
  }
}


function adicionarMembro() {
  const nome = document.getElementById("novoNome").value.trim();
  if (!nome) { toast("Digite um nome!"); return; }
  if (membrosLista.find(m=>m.nome===nome)) { toast("Já existe!"); return; }

  salvarMembros(); renderMembros();
  document.getElementById("modalMembro").classList.remove("aberto");
  document.getElementById("novoNome").value = "";
  toast(`${nome} entrou na família! 🏠`);
  beep(880,.1,'sine',.2);
}
function fecharModal(e) {
  if(e.target===document.getElementById("modalMembro"))
    document.getElementById("modalMembro").classList.remove("aberto");
}

function voltarChat() {
  if (history.length > 1) history.back();
  else toast("Você já está no chat.");
}

function atualizarCabecalho() {
  const avatar = document.getElementById("topoAvatar");
  if (!avatar) return;
  const foto = membrosLista.find(m => m.nome === meuNome)?.foto || minhaFoto;
  avatar.innerHTML = foto
    ? `<img src="${foto}" alt="">`
    : '<i class="fa-solid fa-user"></i>';

function abrirTela(id) {
  document.querySelectorAll(".tela").forEach(t=>t.classList.remove("ativa"));
  document.getElementById("tela-"+id).classList.add("ativa");
  document.getElementById("controles").style.display = id==="chat"? "flex" : "none";
  vibrar(25);

const MESSAGES_CACHE_KEY = "oio_familia_mensagens_cache_v2";
let mensagensCache = [];

function carregarCacheMensagens() {
  try {
    const cache = JSON.parse(localStorage.getItem(MESSAGES_CACHE_KEY) || "[]");
    return Array.isArray(cache) ? cache.slice(-100) : [];
  } catch(e) {
    return [];
  }
}

function salvarCacheMensagens(lista) {
  try {
    mensagensCache = lista.slice(-100);
    localStorage.setItem(MESSAGES_CACHE_KEY, JSON.stringify(mensagensCache));
  } catch(e) {
    console.warn("Não foi possível salvar o cache local das mensagens.", e);
  }
}

function renderListaMensagens(lista) {
  const container = document.getElementById("mensagens");
  const eraNoFundo = container.scrollHeight - container.scrollTop - container.clientHeight < 80;
  container.innerHTML = "";
  lista.forEach(m => renderMensagem(m, container));
  if (eraNoFundo || primeiraCarga) container.scrollTop = container.scrollHeight;
}

async function enviar() {
  const input = document.getElementById("msgInput");
  if (!auth.currentUser) {
    abrirLogin();
    toast("Entre na sua conta para enviar mensagens.");
    return;
  }
  const texto = input.value.trim();
  if (!texto) return;

  if(texto.startsWith('@ia ')) {
    chamarIA(texto.replace('@ia ', ''));
    input.value = "";
    return;
  }

  const mensagem = {
    nome: meuNome,
    foto: minhaFoto,
    texto,
    ts: Date.now()
  };

  // Mostra imediatamente, como um mensageiro nativo.
  const pushRef = dbMsg.push();
  mensagem.id = pushRef.key;
  mensagem.pendente = true;
  const instantList = mensagensCache.concat([mensagem]).slice(-100);
  mensagensCache = instantList;
  renderListaMensagens(instantList);
  salvarCacheMensagens(instantList);
  somEnviar();
  vibrar(25);
  input.value = "";

  pushRef.set({
    nome: mensagem.nome,
    foto: mensagem.foto || "",
    texto: mensagem.texto,
    ts: mensagem.ts,
    id: mensagem.id
  }).catch(err => {
    console.error("Falha ao salvar mensagem:", err);
    toast("Mensagem não salva. Verifique a conexão.");
  });
}

let primeiraCarga = true;
let contadorMsgs = 0;
mensagensCache = carregarCacheMensagens();

if (mensagensCache.length) {
  renderListaMensagens(mensagensCache);
}

dbMsg.limitToLast(100).on("value", snap => {
  const lista = [];
  snap.forEach(c => {
    const mensagem = c.val();
    if (mensagem && (mensagem.texto || mensagem.audio)) {
      lista.push(mensagem);
    }
  });

  // Só substitui a tela quando o Firebase entregou uma lista válida.
  // Assim uma falha transitória de leitura não apaga as mensagens da tela.
  if (lista.length > 0 || snap.exists()) {
    if (!primeiraCarga && lista.length > contadorMsgs) {
      somReceber();
      vibrar(30);
    }
    renderListaMensagens(lista);
    salvarCacheMensagens(lista);
    contadorMsgs = lista.length;
  } else if (!mensagensCache.length) {
    renderListaMensagens([]);
  }

  primeiraCarga = false;
}, error => {
  console.error("Leitura do chat cancelada:", error);
  if (mensagensCache.length) {
    renderListaMensagens(mensagensCache);
  }
  toast("Mantendo as mensagens salvas neste aparelho.");
});

function renderMensagem(m, container) {
  const minha = m.nome === meuNome;
  const wrap = document.createElement("div");
  wrap.className = `balao-wrap ${minha? "minha" : "deles"}`;
  let conteudo = "";
  // Fotos e vídeos ficam deliberadamente bloqueados nesta versão.
  // Mensagens de texto e áudio continuam disponíveis.
  if (m.texto) conteudo += `<div>${escapeHtml(m.texto)}</div>`;
  if (m.audio) conteudo += `<audio controls style="width:100%;margin-top:8px;height:40px" preload="metadata"><source src="${m.audio}" type="audio/webm"></audio>`;
  if (!conteudo) return;
  const hora = m.ts? new Date(m.ts).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}) : "";
  wrap.innerHTML = `${!minha? `<div class="balao-autor">${escapeHtml(m.nome)}</div>` : ""}<div class="balao ${minha? "minha" : "deles"}">${conteudo}<span class="balao-time">${hora}</span></div>`;
  container.appendChild(wrap);
}

function escapeHtml(t) {
  const p = document.createElement("p");
  p.textContent = t;
  return p.innerHTML;
}

let mediaRecorder;
let audioChunks = [];
let tempoGravacao = 0;
let tempoInterval;

async function toggleGravacao() {
  const btn = document.getElementById("btnMic");
  const input = document.getElementById("msgInput");
  if (!mediaRecorder || mediaRecorder.state === "inactive") {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio:true });
      mediaRecorder = new MediaRecorder(stream);
      audioChunks = [];
      mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
      mediaRecorder.onstop = () => {
        clearInterval(tempoInterval);
        dbStatus.child(meuNome).remove();
        input.placeholder = "Mensagem para a família...";
        const reader = new FileReader();
        reader.readAsDataURL(new Blob(audioChunks, { type:"audio/webm" }));
        reader.onloadend = async () => {
          try {
            if (!auth.currentUser) {
              abrirLogin();
              toast("Entre na sua conta para enviar áudio.");
              return;
            }
            await dbMsg.push({ nome:meuNome, audio:reader.result, ts:Date.now() });
            somEnviar(); vibrar(60);
          } catch (err) {
            console.error("Falha ao salvar áudio:", err);
            toast("Áudio não salvo. Verifique a autenticação.");
          }
        };
      };
      mediaRecorder.start();
      dbStatus.child(meuNome).set({ gravando: true, ts: Date.now() });
      btn.classList.add("gravando");
      btn.querySelector("i").className = "fa-solid fa-stop";
      beep(440,.05);
      tempoGravacao = 0;
      input.placeholder = "0:00 🔴 Gravando...";
      tempoInterval = setInterval(() => {
        tempoGravacao++;
        const min = Math.floor(tempoGravacao/60);
        const seg = tempoGravacao % 60;
        input.placeholder = `${min}:${seg.toString().padStart(2,'0')} 🔴 Toque pra enviar`;
        if(tempoGravacao >= 60) toggleGravacao();
      }, 1000);
    } catch(e) {
      toast("Microfone não autorizado ❌");
    }
  } else {
    mediaRecorder.stop();
    mediaRecorder.stream?.getTracks().forEach(t=>t.stop());
    btn.classList.remove("gravando");
    btn.querySelector("i").className = "fa-solid fa-microphone";
  }
}

dbStatus.on('value', snap => {
  const input = document.getElementById("msgInput");
  if(input.placeholder.includes("🔴 Gravando")) return;
  let gravando = [];
  snap.forEach(c => {
    const v = c.val();
    if(v.gravando && c.key!== meuNome && Date.now() - v.ts < 70000) gravando.push(c.key);
  });
  if(gravando.length > 0) {
    input.placeholder = `${gravando[0]} está gravando áudio...`;
  } else if(input.placeholder.includes("está gravando")) {
    input.placeholder = "Mensagem para a família...";
  }
});

async function chamarIA(pergunta) {
  const prompt = `Você é OIO IA, assistente carinhoso da família. Responda em 1-2 frases, PT-BR, tom leve: ${pergunta}`;
  try {
    toast("OIO IA digitando...");
    const resp = await fetch('https://api-inference.huggingface.co/models/mistralai/Mistral-7B-Instruct-v0.2', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({inputs: prompt, parameters: {max_new_tokens: 60}})
    });
    const data = await resp.json();
    let resposta = data[0]?.generated_text?.replace(prompt, '').trim() || "Tô sem ideia agora 😅";
    dbMsg.push({ nome: "OIO IA", texto: resposta, ts: Date.now() });
  } catch(e) {
    dbMsg.push({ nome: "OIO IA", texto: "Tô offline, família. Tenta depois 💙", ts: Date.now() });
  }
}
